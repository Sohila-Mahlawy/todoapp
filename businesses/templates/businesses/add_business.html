{% extends 'base.html' %}

{% block page_title %}Add Your Business{% endblock %}

{% block content %}
<div id="page-wrapper" style="padding: 30px; background-color: #f4f4f9;">
    <div id="page-inner" style="background-color: #ffffff; padding: 30px; border-radius: 8px;">
        <div class="row">
            <div class="col-md-12">
                <h2 style="color: #333; font-size: 24px;" data-i18n="Admin Dashboard">Add Your Business</h2>
                <h5 style="color: #555;"><span data-i18n="Welcome">Welcome</span> {{user.username}}, <span data-i18n="Love to see you back">Love to see you back</span>.</h5>
            </div>
        </div>              
        <hr />
        
        <form method="POST" enctype="multipart/form-data" style="max-width: 600px; margin: 0 auto;">
            {% csrf_token %}
            
            <label for="company_name" style="font-weight: bold;">Company Name:</label>
            <input type="text" id="company_name" name="company_name" required 
                   style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ddd;">
            <br>
        
            <label for="description" style="font-weight: bold;">Company Description:</label>
            <textarea id="description" name="description" required 
                      style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ddd; height: 150px;"></textarea>
            <br>
        
            <label for="icon" style="font-weight: bold;">Company Icon:</label>
            <input type="file" id="icon" name="icon" accept="image/*" required 
                   style="padding: 10px; margin-bottom: 15px; border-radius: 4px;">
            <br>
        
            <label for="employee_file" style="font-weight: bold;">Employee Details (Excel file):</label>
            <input type="file" id="employee_file" name="employee_file" accept=".xls,.xlsx" required 
                   style="padding: 10px; margin-bottom: 15px; border-radius: 4px;">
            <br>
        
            <label for="category" style="font-weight: bold;">Category:</label>
            <input type="text" id="category" name="category" required 
                   style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ddd;">
            <br>
        
            <label for="terms_output" style="font-weight: bold;">Terms:</label>
            <textarea id="terms_output" name="terms" readonly 
                      style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 4px; border: 1px solid #ddd;" 
                      rows="5" cols="50"></textarea>
            <br>
        
            <button type="button" id="generate-terms-btn" class="btn btn-outline-primary btn-sm mb-0 me-3">
            Generate Terms Using AI
            </button>
            <br><br>
        
            <button type="submit" class="btn bg-gradient-dark w-100">
                Add Business
            </button>
        </form>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function () {
    const companyNameInput = document.getElementById('company_name');
    const descriptionInput = document.getElementById('description');
    const termsOutput = document.getElementById('terms_output');
    const generateTermsBtn = document.getElementById('generate-terms-btn');

    // Function to generate terms when the button is clicked
    function fetchTerms() {
        const companyName = companyNameInput.value;
        const companyDescription = descriptionInput.value;

        if (companyName && companyDescription) {
            termsOutput.value = "Generating terms...";

            fetch('/generate-terms/', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-CSRFToken': '{{ csrf_token }}' // CSRF token for Django
                },
                body: JSON.stringify({
                    company_name: companyName,
                    company_description: companyDescription
                })
            })
            .then(response => response.json())
            .then(data => {
                if (data.error) {
                    termsOutput.value = `Error: ${data.error}`;
                } else {
                    termsOutput.value = data.terms_policies || "No terms generated.";
                }
            })
            .catch(error => {
                termsOutput.value = `Error generating terms: ${error.message}`;
                console.error('Error generating terms:', error);
            });
        }
    }

    // Event listener for the "Generate Terms Using AI" button
    generateTermsBtn.addEventListener('click', fetchTerms);
});
</script>
{% endblock %}
