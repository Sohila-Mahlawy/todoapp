{% extends 'base.html' %}
{% block content %}
{% block page_title %}Upload Call Center{% endblock %}

        <div id="page-wrapper" >
            <div id="page-inner">
                <div class="row">
                    <div class="col-md-12">
                     <h2>Upload Call Center ZIP File
                    </h2>   
                        <h5>Welcome {{user.username}} , Love to see you back. </h5>
                    </div>
                </div>              
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    {{ form.as_p }} <!-- Keep the form as it is -->
                    <button type="submit" class="btn btn-primary">
                        <i class="fa fa-upload"></i> Upload
                    </button>
                </form>
                <style>
                    /* Style the form container */
                    form {
                        max-width: 500px;
                        margin: 20px auto;
                        padding: 20px;
                        border: 1px solid #ddd;
                        border-radius: 5px;
                        background-color: #f9f9f9;
                    }
                
                    /* Style the form labels */
                    form label {
                        font-weight: bold;
                        margin-bottom: 5px;
                        display: block;
                    }
                
                    /* Style the form inputs */
                    form input[type="file"] {
                        display: block;
                        margin-bottom: 15px;
                        padding: 10px;
                        border: 1px solid #ccc;
                        border-radius: 4px;
                        width: 100%;
                    }
                
                    /* Style the submit button */
                    form button {
                        background-color: #4CAF50; /* Green */
                        color: white;
                        padding: 10px 20px;
                        border: none;
                        border-radius: 4px;
                        cursor: pointer;
                        font-size: 16px;
                    }
                
                    form button:hover {
                        background-color: #45a049; /* Darker green on hover */
                    }
                
                    /* Add spacing between form elements */
                    form p {
                        margin-bottom: 15px;
                    }
                </style>

                {% endblock %}
