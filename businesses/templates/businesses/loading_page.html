<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Processing...</title>
    <style>
/* Fullscreen container to center the loader */
body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center; /* Center horizontally */
    align-items: center; /* Center vertically */
    height: 100vh; /* Full viewport height */
    background-color: #f5f5f5; /* Light background color */
    font-family: Arial, sans-serif;
}

/* Main loader container */
#wifi-loader {
    --background: #62abff;
    --front-color: #4f29f0;
    --back-color: #c3c8de;
    --text-color: #414856;
    width: 128px; /* Increased size */
    height: 128px; /* Increased size */
    border-radius: 50%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* SVG styles */
#wifi-loader svg {
    position: absolute;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Circle styles */
#wifi-loader svg circle {
    position: absolute;
    fill: none;
    stroke-width: 8px; /* Increased stroke width */
    stroke-linecap: round;
    stroke-linejoin: round;
    transform: rotate(-100deg);
    transform-origin: center;
}

/* Back circle */
#wifi-loader svg circle.back {
    stroke: var(--back-color);
}

/* Front circle */
#wifi-loader svg circle.front {
    stroke: var(--front-color);
}

/* Outer circle */
#wifi-loader svg.circle-outer {
    height: 172px; /* Increased size */
    width: 172px; /* Increased size */
}

#wifi-loader svg.circle-outer circle {
    stroke-dasharray: 125.5 376.5; /* Adjusted for larger size */
}

#wifi-loader svg.circle-outer circle.back {
    animation: circle-outer135 1.8s ease infinite 0.3s;
}

#wifi-loader svg.circle-outer circle.front {
    animation: circle-outer135 1.8s ease infinite 0.15s;
}

/* Middle circle */
#wifi-loader svg.circle-middle {
    height: 120px; /* Increased size */
    width: 120px; /* Increased size */
}

#wifi-loader svg.circle-middle circle {
    stroke-dasharray: 85 255; /* Adjusted for larger size */
}

#wifi-loader svg.circle-middle circle.back {
    animation: circle-middle6123 1.8s ease infinite 0.25s;
}

#wifi-loader svg.circle-middle circle.front {
    animation: circle-middle6123 1.8s ease infinite 0.1s;
}

/* Inner circle */
#wifi-loader svg.circle-inner {
    height: 68px; /* Increased size */
    width: 68px; /* Increased size */
}

#wifi-loader svg.circle-inner circle {
    stroke-dasharray: 44 132; /* Adjusted for larger size */
}

#wifi-loader svg.circle-inner circle.back {
    animation: circle-inner162 1.8s ease infinite 0.2s;
}

#wifi-loader svg.circle-inner circle.front {
    animation: circle-inner162 1.8s ease infinite 0.05s;
}

/* Text below the loader */
#wifi-loader .text {
    position: absolute;
    bottom: -60px; /* Adjusted for larger size */
    display: flex;
    justify-content: center;
    align-items: center;
    text-transform: lowercase;
    font-weight: 500;
    font-size: 18px; /* Increased font size */
    letter-spacing: 0.2px;
    color: var(--text-color);
}

/* Animation for the text */
#wifi-loader .text::before,
#wifi-loader .text::after {
    content: attr(data-text);
}

#wifi-loader .text::before {
    color: var(--text-color);
}

#wifi-loader .text::after {
    color: var(--front-color);
    animation: text-animation76 3.6s ease infinite;
    position: absolute;
    left: 0;
}

/* Keyframes for animations */
@keyframes circle-outer135 {
    0% {
        stroke-dashoffset: 50;
    }
    25% {
        stroke-dashoffset: 0;
    }
    65% {
        stroke-dashoffset: 602;
    }
    80% {
        stroke-dashoffset: 552;
    }
    100% {
        stroke-dashoffset: 552;
    }
}

@keyframes circle-middle6123 {
    0% {
        stroke-dashoffset: 34;
    }
    25% {
        stroke-dashoffset: 0;
    }
    65% {
        stroke-dashoffset: 408;
    }
    80% {
        stroke-dashoffset: 374;
    }
    100% {
        stroke-dashoffset: 374;
    }
}

@keyframes circle-inner162 {
    0% {
        stroke-dashoffset: 18;
    }
    25% {
        stroke-dashoffset: 0;
    }
    65% {
        stroke-dashoffset: 212;
    }
    80% {
        stroke-dashoffset: 194;
    }
    100% {
        stroke-dashoffset: 194;
    }
}

@keyframes text-animation76 {
    0% {
        clip-path: inset(0 100% 0 0);
    }
    50% {
        clip-path: inset(0);
    }
    100% {
        clip-path: inset(0 0 0 100%);
    }
} 
#progress-text {
            font-size: 24px;
            color: var(--text-color);
            position: absolute;
            top: 140%;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div id="wifi-loader">
        <svg class="circle-outer" viewBox="0 0 86 86">
            <circle class="back" cx="43" cy="43" r="40"></circle>
            <circle class="front" cx="43" cy="43" r="40"></circle>
            <circle class="new" cx="43" cy="43" r="40"></circle>
        </svg>
        <div class="text" data-text="Processing"></div>
    </div>
    <div id="progress-text">Progress: 0%</div>
    
    <script>
let intervalId;

function checkProgress() {
    fetch('/get-progress/')
        .then(response => response.json())
        .then(data => {
            const progress = data.progress;
            document.getElementById('progress-text').textContent = `Progress: ${progress}%`;

            if (progress === 100) {
                clearInterval(intervalId); // Stop checking progress
                window.location.href = '/'; // Redirect to dashboard
            } else if (progress === -1) {
                clearInterval(intervalId);
                alert('An error occurred while processing the file.');
            }
        })
        .catch(error => {
            console.error('Error fetching progress:', error);
        });
}

document.addEventListener('DOMContentLoaded', () => {
    intervalId = setInterval(checkProgress, 2000); // Check every 2 seconds
});

    </script>
</body>
