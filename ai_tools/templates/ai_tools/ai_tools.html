<!-- templates/ai_tools.html -->
{% extends "base.html" %}
{% block page_title %}Ai Tools{% endblock %}
{% block content %}
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<div class="container mt-5">
    <h1 class="text-center mb-4">AI Tools</h1>
    <div class="row">
        {% for tool in tools %}
        <div class="col-md-4 mb-4">
            <div class="card text-center">
                <div class="card-body">
                    <i class="fas fa-{{ tool.icon }} fa-3x mb-3"></i> <!-- Font Awesome Icon -->
                    <h5 class="card-title">{{ tool.name }}</h5>
                    <a href="{% url tool.url %}" class="btn btn-primary">Use Tool</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
