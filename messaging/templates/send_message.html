{% extends "messages_base.html" %}

{% block content %}
<div class="container">
    <h2>Send Message</h2>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label for="recipients">Recipients:</label>
            {{ form.recipients }}
        </div>
        <div class="form-group">
            <label for="id_subject">Subject:</label>
            {{ form.subject }}
        </div>
        <div class="form-group">
            <label for="id_body">Message:</label>
            {{ form.body }}
        </div>
        <button type="submit" class="btn btn-primary">Send</button>
    </form>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://code.jquery.com/ui/1.12.1/jquery-ui.min.js"></script>
<script>
$(function() {
    $('#recipients').autocomplete({
        source: function(request, response) {
            $.ajax({
                url: $("#recipients").attr("data-autocomplete-url"),
                data: { term: request.term },
                success: function(data) {
                    response(data);
                }
            });
        },
        minLength: 2,
        messages: {
            noResults: '', // Remove the "No results found" message
            results: function() {} // Remove the result count message
        }
    });
});
</script>

<!-- Add custom CSS -->
<style>
    /* Style the autocomplete suggestion list */
    .ui-autocomplete {
        max-height: 200px;
        overflow-y: auto;
        overflow-x: hidden;
        background-color: #f5f5f5;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-shadow: 0 2px 5px rgba(0,0,0,0.2);
    }
    .ui-autocomplete li {
        padding: 8px 12px;
        font-size: 14px;
        cursor: pointer;
    }
    .ui-autocomplete li:hover {
        background-color: #e0e0e0;
    }
    /* Remove the messages */
    .ui-autocomplete .ui-menu-item {
        display: block;
    }
    .ui-autocomplete .ui-menu-item.ui-widget-content {
        display: none; /* Hide the message items */
    }
</style>
{% endblock %}
</body>
</html>
