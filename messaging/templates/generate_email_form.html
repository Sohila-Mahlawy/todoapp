<form id="emailForm" action="{% url 'generate_email_form' %}" method="POST">
    {% csrf_token %}
    <label for="receiver_name">Receiver Name:</label>
    <select id="receiver_name" name="receiver_name" required>
      {% for member in business_members %}
        <option value="{{ member.username }}">{{ member.first_name }} {{ member.last_name }}</option>
      {% endfor %}
    </select>
  
    <label for="sender_name">Sender Name:</label>
    <input type="text" id="sender_name" name="sender_name" value="{{ sender_name }}" readonly>
  
    <label for="topic">Topic:</label>
    <input type="text" id="topic" name="topic" required>
  
    <button type="button">Generate Email</button>
  </form>
