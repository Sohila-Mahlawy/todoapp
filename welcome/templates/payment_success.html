<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Successful</title>
    <style>
        .container {
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            margin: 100px auto;
            padding: 40px;
            text-align: center;
        }
        .title {
            color: #333;
            font-size: 36px;
            margin-bottom: 20px;
        }
        .message {
            color: #555;
            font-size: 20px;
            margin-bottom: 30px;
        }
        .btn {
            background-color: #353536;
            border: none;
            border-radius: 5px;
            color: white;
            cursor: pointer;
            font-size: 18px;
            padding: 12px 24px;
            text-decoration: none;
            transition: background-color 0.3s;
        }
        .btn:hover {
            background-color: #353536;
        }
    </style>
</head>
<body style="background-image: url('https://images.unsplash.com/photo-1497294815431-9365093b7331?ixlib=rb-1.2.1&ixid=MnwxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8&auto=format&fit=crop&w=1950&q=80'); background-size: cover; background-position: center;">
    <div class="container">
        <h1 class="title">Thank You!</h1>
        <p class="message">Your payment was successful. You are now subscribed to the Pro plan.</p>
        <a href="/" class="btn">Back to Dashboard</a>
    </div>
</body>
</html>
